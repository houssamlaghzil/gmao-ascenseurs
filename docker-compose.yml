# =============================================================================
# Docker Compose - GMAO Ascenseurs
# =============================================================================
# Usage :
#   1. Copier .env.example vers .env et renseigner les variables
#   2. docker compose up -d --build
#
# Ce fichier NE publie PAS de port sur l'hôte. Sur une plateforme qui gère
# elle-même son reverse proxy (Dokploy, Traefik...), c'est la plateforme qui
# route un domaine vers le port interne du conteneur (3000) via le réseau
# Docker, sans jamais réserver ce port sur l'hôte lui-même — c'est ce qui
# évite l'erreur "port is already allocated" dès qu'un autre service partage
# le même hôte. Pour un accès direct en local (sans Dokploy), ajoute un
# fichier docker-compose.override.yml avec :
#   services:
#     web:
#       ports:
#         - "3000:3000"
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Pas de `image:`/`container_name:` fixes : plusieurs environnements
    # (production, dev...) peuvent coexister sur le même hôte Docker.
    # Compose les nomme automatiquement à partir du nom de projet (-p),
    # que la plateforme (Dokploy) fixe déjà de façon unique par déploiement.

    # Charger automatiquement les variables depuis .env
    env_file:
      - .env
    
    # Variables d'environnement (peuvent override celles du .env)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Variables runtime (non-NEXT_PUBLIC_*)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    # Volumes pour persister les données
    volumes:
      - gmao_data:/app/data
    
    restart: unless-stopped
    
    # Logging configuré
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Ressources limitées (optionnel, décommenter si nécessaire)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  gmao_data:
    driver: local
